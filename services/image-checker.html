<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TruthLens - Image Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>TruthLens Image Checker</h1>

        <p>
            Upload an image to check basic authenticity signals.
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <br><br>

            <img
                id="imagePreview"
                style="display:none; max-width:400px; max-height:300px;"
                alt="Image Preview"
            >

            <br><br>

            <button onclick="analyzeImage()">
                Analyze Image
            </button>

        </div>

        <div id="result" style="margin-top:30px;"></div>

    </div>


    <script>

        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");
        const result = document.getElementById("result");


        // Image preview
        imageInput.addEventListener("change", function () {

            const file = imageInput.files[0];

            if (!file) {
                imagePreview.style.display = "none";
                return;
            }

            const imageURL = URL.createObjectURL(file);

            imagePreview.src = imageURL;
            imagePreview.style.display = "block";

            result.innerHTML = "";
        });


        // Analyze image
        async function analyzeImage() {

            const file = imageInput.files[0];

            if (!file) {

                result.innerHTML =
                    "<p>Please select an image first.</p>";

                return;
            }


            result.innerHTML =
                "<p>Analyzing image...</p>";


            const formData = new FormData();

            formData.append("image", file);


            try {

                const response = await fetch(
                    "/analyze-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const data = await response.json();


                if (data.status === "uncertain") {

                    let signalsHTML = "";

                    if (data.signals && data.signals.length > 0) {

                        signalsHTML = data.signals
                            .map(signal => `<li>${signal}</li>`)
                            .join("");

                    } else {

                        signalsHTML =
                            "<li>No basic manipulation signals detected.</li>";
                    }


                    result.innerHTML = `
                        <h2>Image Analysis Result</h2>

                        <p>
                            <strong>Status:</strong>
                            ${data.status}
                        </p>

                        <p>
                            <strong>Message:</strong>
                            ${data.message}
                        </p>

                        <h3>Image Information</h3>

                        <p>
                            <strong>Width:</strong>
                            ${data.image.width}px
                        </p>

                        <p>
                            <strong>Height:</strong>
                            ${data.image.height}px
                        </p>

                        <p>
                            <strong>Format:</strong>
                            ${data.image.format}
                        </p>

                        <p>
                            <strong>Mode:</strong>
                            ${data.image.mode}
                        </p>

                        <p>
                            <strong>File Size:</strong>
                            ${data.image.file_size_kb} KB
                        </p>

                        <p>
                            <strong>Metadata:</strong>
                            ${data.image.metadata}
                        </p>

                        <h3>Signals</h3>

                        <ul>
                            ${signalsHTML}
                        </ul>
                    `;

                } else {

                    result.innerHTML = `
                        <h2>Image Analysis Error</h2>

                        <p>
                            ${data.message}
                        </p>
                    `;
                }


            } catch (error) {

                result.innerHTML = `
                    <p>
                        Unable to connect to the server.
                    </p>
                `;

                console.error(error);
            }

        }

    </script>

</body>
</html>
